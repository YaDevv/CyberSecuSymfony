# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        # Faux service « mots de passe fuités » : les tests n'appellent jamais Internet
        http_client:
            mock_response_factory: App\Tests\Support\FauxServiceMotsDePasseFuites
        session:
            storage_factory_id: session.storage.factory.mock_file
